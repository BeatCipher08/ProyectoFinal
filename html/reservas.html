<!DOCTYPE html>
<html lang="es">
    <header>
        <nav>
            <a href="#">Sobre Nosotros</a>
            <a href="#">Novedades</a>
        </nav>
    </header>

    <main>
        <section class="columna-1">
            <h2>Lista de Objetos</h2>
            <ul>
                <li>Objeto-1</li>
                <li>Objeto-2</li>
                <li>Objeto-3</li>
            </ul>

            <h2>Reservados</h2>
            <table border="1">
                <thead>
                    <tr>
                     <th>Objetos</th>
                     <th>Hora y Dia</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>&nbsp;</td>
                        <td>&nbsp;</td>
                    </tr>
                </tbody>

        </section>
        
    <section class="columna-2">
        <h2>Pedir Herramienta de Trabajo</h2>

      <form action="#" method="POST">
        <div>
          <label for="objeto">Objeto:</label>
          <input type="text" id="objeto" name="objeto">
        </div>

        <div>
          <label for="fechahora">Dia y Hora:</label>
          <input type="datetime-local" id="fechahora" name="fechahora">
        </div>

        <div>
          <label for="razon">Razón:</label>
          <textarea id="razon" name="razon" rows="4"></textarea>
        </div>

        <button type="submit">Enviar</button>
      </form>
    </section>
    </main>
</html>
